<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexTrade Prime — Trade Forex, Gold, Indices & Crypto on MT5</title>
<meta name="description" content="NexTrade Prime — trade forex, gold, indices, crypto and energies on MetaTrader 5. Spreads from 0.0 pips, leverage up to 1:500, accounts from $10.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo-light.png">
<!-- Preload the hero poster still so the chart backdrop paints with the first
     render instead of waiting for the React bundle + video to load. -->
<link rel="preload" as="image" href="assets/hero-poster.jpg" fetchpriority="high">
<!-- Single Page Apps for GitHub Pages (rafrex/spa-github-pages): restores the
     route saved by public/404.html. The document always loads from the repo
     root, so the relative favicon above resolves in dev and in production. -->
<script>
  (function(l){if(l.search[1]==='/'){var d=l.search.slice(1).split('&').map(function(s){return s.replace(/~and~/g,'&')}).join('?');window.history.replaceState(null,null,l.pathname.slice(0,-1)+d+l.hash)}})(window.location)
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
