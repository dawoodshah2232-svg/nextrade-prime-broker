name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nextradeprime-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    # Pinned: ubuntu-latest is moving to Ubuntu 26 (from 19 Oct 2026) and
    # deploys started failing at the SSH step around that switch.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare SSH
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT || '22' }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
        run: |
          test -n "$CPANEL_HOST" || { echo "CPANEL_HOST secret is missing"; exit 1; }
          test -n "$CPANEL_SSH_KEY" || { echo "CPANEL_SSH_KEY secret is missing"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$CPANEL_SSH_KEY" > ~/.ssh/cpanel_key
          chmod 600 ~/.ssh/cpanel_key
          # cPanel-generated keys usually have a passphrase: strip it from this
          # throwaway copy so rsync can run non-interactively.
          if [ -n "$CPANEL_SSH_PASSPHRASE" ]; then
            ssh-keygen -p -P "$CPANEL_SSH_PASSPHRASE" -N '' -f ~/.ssh/cpanel_key >/dev/null
          fi
          # Host key: retry with a longer timeout (cPanel hosts can be slow to
          # answer and ssh-keyscan fails silently). Not fatal on its own - the
          # upload step uses accept-new, so a real connection problem shows up
          # there as a readable ssh error instead of a bare "exit code 1".
          for i in 1 2 3; do
            if ssh-keyscan -T 20 -p "$CPANEL_PORT" "$CPANEL_HOST" >> ~/.ssh/known_hosts 2>/dev/null \
              && [ -s ~/.ssh/known_hosts ]; then
              echo "Host key added"; break
            fi
            echo "ssh-keyscan attempt $i failed"; sleep 5
          done

      - name: Upload build to cPanel
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT || '22' }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TARGET: ${{ secrets.CPANEL_TARGET }}
        run: |
          test -n "$CPANEL_USER" || { echo "CPANEL_USER secret is missing"; exit 1; }
          test -n "$CPANEL_TARGET" || { echo "CPANEL_TARGET secret is missing"; exit 1; }
          # Only the contents of dist/ go live. --delete removes stale build
          # files, but never touches cPanel/SSL folders that live alongside.
          # The host drops an SSH connection now and then (exit 255) - retry
          # a few times before failing the deploy.
          for i in 1 2 3 4; do
            if rsync -az --delete \
              --exclude '/.well-known/' \
              --exclude '/cgi-bin/' \
              --exclude '/.user.ini' \
              -e "ssh -i ~/.ssh/cpanel_key -p $CPANEL_PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15" \
              dist/ "$CPANEL_USER@$CPANEL_HOST:$CPANEL_TARGET/"; then
              echo "Deployed on attempt $i"; exit 0
            fi
            echo "Upload attempt $i failed, retrying in $((i * 15))s"; sleep $((i * 15))
          done
          exit 1

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/cpanel_key
