name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nextradeprime-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare SSH
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT || '22' }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
        run: |
          test -n "$CPANEL_HOST" || { echo "CPANEL_HOST secret is missing"; exit 1; }
          test -n "$CPANEL_SSH_KEY" || { echo "CPANEL_SSH_KEY secret is missing"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$CPANEL_SSH_KEY" > ~/.ssh/cpanel_key
          chmod 600 ~/.ssh/cpanel_key
          # cPanel-generated keys usually have a passphrase: strip it from this
          # throwaway copy so rsync can run non-interactively.
          if [ -n "$CPANEL_SSH_PASSPHRASE" ]; then
            ssh-keygen -p -P "$CPANEL_SSH_PASSPHRASE" -N '' -f ~/.ssh/cpanel_key >/dev/null
          fi
          ssh-keyscan -p "$CPANEL_PORT" "$CPANEL_HOST" >> ~/.ssh/known_hosts

      - name: Upload build to cPanel
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT || '22' }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TARGET: ${{ secrets.CPANEL_TARGET }}
        run: |
          test -n "$CPANEL_USER" || { echo "CPANEL_USER secret is missing"; exit 1; }
          test -n "$CPANEL_TARGET" || { echo "CPANEL_TARGET secret is missing"; exit 1; }
          # Only the contents of dist/ go live. --delete removes stale build
          # files, but never touches cPanel/SSL folders that live alongside.
          rsync -az --delete \
            --exclude '/.well-known/' \
            --exclude '/cgi-bin/' \
            --exclude '/.user.ini' \
            -e "ssh -i ~/.ssh/cpanel_key -p $CPANEL_PORT" \
            dist/ "$CPANEL_USER@$CPANEL_HOST:$CPANEL_TARGET/"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/cpanel_key
